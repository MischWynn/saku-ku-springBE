<div class="login-page">

  <div class="container login-shell">
    <div class="row g-4 align-items-center">

      <!-- LEFT : HERO IMAGE -->
      <div class="col-lg-6 d-none d-lg-block">

        <div class="hero-banner shadow-sm">

          <div class="glass-card p-4 shadow-sm">
            <h5 class="fw-bold text-primary mb-2">
              Welcome to Saku-ku
            </h5>

            <p class="text-secondary small mb-0">
              Secure portal for administrator access
            </p>
          </div>

        </div>

      </div>


      <!-- RIGHT : LOGIN CARD -->
      <div class="col-12 col-lg-6">

        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white login-card">

          <div class="card-body p-0">

            <!-- LOGO -->
            <div class="d-flex align-items-center gap-2 mb-4">

              <div
                class="logo-box bg-primary text-white rounded-3
                       d-flex align-items-center justify-content-center">

                <i class="bi bi-wallet2 fs-5"></i>

              </div>

              <h4 class="fw-bold text-primary mb-0">
                Saku-ku
              </h4>

            </div>


            <!-- TITLE -->
            <h4 class="fw-bold text-dark mb-1">
              Selamat datang kembali
            </h4>

            <p class="text-secondary small mb-4">
              Silakan masuk ke akun administrator Anda
            </p>


            <!-- FORM -->
            <form (ngSubmit)="login()">

              <!-- EMAIL -->
              <div class="mb-3">

                  <label
                    for="email"
                    class="form-label small fw-semibold text-dark mb-1">

                  Alamat Email

                </label>

                <div class="input-icon-group">

                  <i class="bi bi-envelope start-icon"></i>

                  <input
                    id="email"
                    type="email"
                    name="email"
                    class="form-control form-control-custom text-dark"
                    placeholder="nama@email.com"
                    [value]="email"
                    (input)="email = $any($event.target).value"
                    required>

                </div>

              </div>


              <!-- PASSWORD -->
              <div class="mb-3">

                <div
                  class="d-flex justify-content-between
                         align-items-center mb-1">

                  <label
                    for="password"
                    class="form-label small fw-semibold text-dark mb-0">

                    Kata Sandi

                  </label>

                  <a
                    href="javascript:void(0)"
                    class="text-decoration-none text-primary small fw-medium">

                    Lupa sandi?

                  </a>

                </div>


                <div class="input-icon-group">

                  <i class="bi bi-lock start-icon"></i>

                  <input
                    id="password"
                    [type]="showPassword ? 'text' : 'password'"
                    name="password"
                    class="form-control form-control-custom text-dark"
                    placeholder="Masukkan kata sandi"
                    [value]="password"
                    (input)="password = $any($event.target).value"
                    required>

                  <button
                    type="button"
                    class="end-icon border-0 bg-transparent"
                    [attr.aria-label]="showPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'"
                    [attr.aria-pressed]="showPassword"
                    (click)="togglePassword()">
                    <i
                      aria-hidden="true"
                      [class.bi-eye-slash]="showPassword"
                      [class.bi-eye]="!showPassword">
                    </i>
                  </button>

                </div>

              </div>


              <!-- LOGIN BUTTON -->
              <button
                type="submit"
                class="btn btn-blue">

                <span>Masuk Sekarang</span>

                <i class="bi bi-arrow-right"></i>

              </button>


              <!-- BACK TO HOME -->
              <div class="text-center small text-secondary">

                Bukan admin?

                <a
                  href="javascript:void(0)"
                  class="text-decoration-none text-primary fw-medium">

                  Kembali ke Beranda

                </a>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>
  </div>

</div>
