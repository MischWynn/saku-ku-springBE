services:
  db:
    image: postgres:17-alpine
    container_name: sakuku-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: binar_finance
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sakuku-db-data:/var/lib/postgresql/data
    networks:
      - sakuku-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d binar_finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: sakuku-backend:latest
    container_name: sakuku-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/binar_finance
    volumes:
      # firebase-service-account.json is deliberately .dockerignore'd out of the image (never
      # baked into a layer). Without this mount, FirebaseConfig silently skips init (by design,
      # so FCM being unavailable doesn't crash the app) and any call that needs the Admin SDK -
      # Google Sign-In's verifyIdToken() included - fails with "FirebaseApp with name [DEFAULT]
      # doesn't exist". The file itself must already exist at ~/sakuku/firebase-service-account.json
      # on the VM (same directory as this compose file) - it is NOT copied here by CI/CD.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "8080:8080"
    networks:
      - sakuku-net

networks:
  sakuku-net:
    driver: bridge

volumes:
  sakuku-db-data: