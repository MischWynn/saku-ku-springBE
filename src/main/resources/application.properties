spring.application.name=saku-ku

# Import file .env
spring.config.import=optional:file:.env[.properties]
# === DATABASE POSTGRESQL ===
spring.datasource.url=${DB_URL:jdbc:postgresql://129.226.195.9:5432/binar_finance}
spring.datasource.username=${DB_USERNAME:binar_admin}
spring.datasource.password=${DB_PASSWORD:binar_bc_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
# @Value("${spring.jpa.properties.hibernate.default_schema}")
# private String schema;


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# === REDIS CONFIGURATION (SERVER BINAR) ===
app.security.cors-allowed-origins=http://localhost:4200,http://localhost:5173
app.redis.key-prefix=${REDIS_KEY_PREFIX:vili}
app.redis.host=${REDIS_HOST:129.226.195.9}pao
app.redis.port=${REDIS_PORT:6379}
app.redis.timeout=${REDIS_TIMEOUT:5000ms}
app.redis.username=${REDIS_USERNAME:binar_app}
app.redis.password=${REDIS_PASSWORD:binar_bc_password}

app.redis.lettuce-pool-max-active=100
app.redis.lettuce-pool-max-wait=5000ms
app.redis.lettuce-pool-max-idle=50
app.redis.lettuce-pool-min-idle=10

# Folder tempat menyimpan gambar avatar
app.storage.image-dir=uploads/images

# === HIKARICP CONNECTION POOL (Menjaga koneksi tetap hidup) ===
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000


app.security.jwt-secret=${JWT_SECRET:this-is-a-falbback-jwt-secret}
app.security.jwt-ttl-minutes=15

# === EMAIL (OTP — verifikasi registrasi & forgot password customer) ===
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true